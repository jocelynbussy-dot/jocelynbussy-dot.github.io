<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- 10.11.2026 : page « introuvable » du Battoir, servie par notre serveur (Caddy, modèle site-statique) pour toute
     adresse inconnue. Avant, GitHub Pages montrait sa propre page ; chez nous, sans ce fichier, la page était blanche.
     Aucun script, aucune ressource externe : Oswald n'est pas chargée ici (elle vient de Google sur le site), le titre
     la prend si le navigateur l'a déjà, sinon Arial Narrow. Couleurs : recopie de style.json (STYLE.md). -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<title>Page introuvable · Le Battoir</title>
<style>
  :root{--fond:#FFFFFF;--texte:#222222;--gris:#6B6560;--blanc:#FFFFFF;--titre:Oswald,"Arial Narrow",sans-serif}
  body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.6 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:3px solid var(--texte)}
  header img{width:44px;height:44px;border-radius:50%}
  header a{color:var(--texte);text-decoration:none;font:700 26px/1 var(--titre)}
  main{max-width:560px;margin:0 auto;padding:44px 20px}
  h1{font:700 clamp(30px,6vw,46px)/1.15 var(--titre);margin:0 0 10px}
  p{margin:0 0 16px}
  .gris{color:var(--gris)}
  a.bouton{display:inline-block;background:var(--texte);color:var(--blanc);text-decoration:none;font:600 18px/1 var(--titre);padding:14px 22px;border-radius:6px}
  ul{padding-left:20px;margin:24px 0 0}
  li{margin:6px 0}
  main a{color:var(--texte)}
</style>
</head>
<body>
<header><img src="/apple-touch-icon.png" alt=""><a href="/">LE BATTOIR</a></header>
<main>
  <h1>Cette page n'existe pas</h1>
  <p class="gris">L'adresse est peut-être mal tapée, ou l'événement est passé et sa page a été retirée.</p>
  <p><a class="bouton" href="/">Voir l'agenda de la plaine de l'Orbe</a></p>
  <ul>
    <li><a href="/ce-week-end/">Ce qui se passe ce week-end</a></li>
    <li><a href="/annoncer">Annoncer un événement de votre société</a></li>
  </ul>
</main>
</body>
</html>
